name: Build multi-arch image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 供无法直接 pull ghcr 的环境（如 udocker）离线导入；本阶段仅导出 arm64（麒麟 990 笔记本）
      - name: Export offline tarballs
        shell: bash
        run: |
          set -euo pipefail
          echo "==> exporting linux/arm64"
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha \
            --tag personal-projects:arm64 \
            --output "type=docker,dest=-" . | gzip > personal-projects-arm64.tar.gz
          ls -lh personal-projects-arm64.tar.gz

      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: offline-tarballs
          path: |
            personal-projects-arm64.tar.gz
          retention-days: 30
