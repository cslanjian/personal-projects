name: Build multi-arch image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 供无法直接 pull ghcr 的环境（如 udocker）离线导入
      - name: Export offline tarballs
        run: |
          IMG="ghcr.io/${{ github.repository }}:latest"
          docker pull --platform linux/amd64 "$IMG"
          docker save "$IMG" | gzip > personal-projects-amd64.tar.gz
          docker rmi "$IMG" >/dev/null 2>&1 || true
          docker pull --platform linux/arm64 "$IMG"
          docker save "$IMG" | gzip > personal-projects-arm64.tar.gz
          docker rmi "$IMG" >/dev/null 2>&1 || true

      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: offline-tarballs
          path: |
            personal-projects-amd64.tar.gz
            personal-projects-arm64.tar.gz
          retention-days: 30
